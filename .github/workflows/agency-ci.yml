name: Slickk agency CI
on:
  push:
    branches:
      - agency-transformation-2026-10-26
      - slickk-digital-solutions-v2-2026-10-26
      - slickk-v4-upgrade
      - slickk-flagship-2026-10-28
  pull_request:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFpSucD7-7Bc1qU9'
      PUBLIC_TRACKING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: google-chrome --version
      - run: npm run test:browser
      - name: Lighthouse mobile and desktop lab reports
        run: |
          node scripts/serve.mjs > /tmp/slickk-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          npx lighthouse http://127.0.0.1:4321/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=test-results/lighthouse-mobile.json --quiet
          npx lighthouse http://127.0.0.1:4321/ --preset=desktop --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=test-results/lighthouse-desktop.json --quiet
          node -e "for(const mode of ['mobile','desktop']){const r=require('./test-results/lighthouse-'+mode+'.json');console.log(mode+': '+Object.entries(r.categories).map(([k,v])=>k+'='+Math.round(v.score*100)).join(' '))}"
      - name: Package static Slickk website for Cloudflare dashboard upload
        uses: actions/upload-artifact@v4
        with:
          name: slickk-digital-solutions-v4-site
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
