name: Slickk agency CI
on:
  push:
    branches:
      - agency-transformation-2026-10-26
  pull_request:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
