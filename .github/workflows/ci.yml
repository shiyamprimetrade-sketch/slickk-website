name: Verify public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFpSucD7-7Bc1qU9'
      PUBLIC_TRACKING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm test
