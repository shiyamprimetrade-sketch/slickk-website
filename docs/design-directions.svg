<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="680" viewBox="0 0 1800 680" role="img" aria-labelledby="title desc">
<title id="title">Three SLICKK design directions</title><desc id="desc">Side-by-side visual studies: Nocturnal Observatory, selected Precision Editorial and Kinetic Modules.</desc>
<rect width="1800" height="680" fill="#e6e8eb"/><g font-family="Arial,sans-serif">
<g transform="translate(30 30)"><rect width="560" height="620" fill="#080b14"/><text x="26" y="38" fill="#a3b2c8" font-size="13" letter-spacing="2">A / NOCTURNAL OBSERVATORY</text><path d="M26 58h508" stroke="#2a3650"/><circle cx="410" cy="252" r="140" fill="#31336a" opacity=".65"/><circle cx="410" cy="252" r="100" fill="#168baa" opacity=".5"/><rect x="26" y="112" width="360" height="280" rx="26" fill="#101626" opacity=".9"/><text x="52" y="190" fill="#fff" font-size="42" font-weight="700">Design the</text><text x="52" y="242" fill="#9de3ff" font-size="42" font-weight="700">next thing.</text><rect x="52" y="282" width="160" height="40" rx="12" fill="#8ae5da"/><text x="70" y="308" fill="#071b1c" font-size="16" font-weight="700">Start a project</text><g fill="#101626" stroke="#2a3650"><rect x="26" y="430" width="240" height="135" rx="22"/><rect x="294" y="430" width="240" height="135" rx="22"/></g><text x="46" y="478" fill="#fff" font-size="19">Brand identity</text><text x="314" y="478" fill="#fff" font-size="19">Digital products</text><text x="26" y="600" fill="#a3b2c8" font-size="14">Atmospheric, but familiar card language.</text></g>
<g transform="translate(620 30)"><rect width="560" height="620" fill="#080b10"/><text x="26" y="38" fill="#4bd7ef" font-size="13" letter-spacing="2">B / PRECISION EDITORIAL · SELECTED</text><path d="M26 58h508" stroke="#5a6777"/><text x="26" y="154" fill="#f5f3ef" font-size="57" font-weight="700" letter-spacing="-3">We Design.</text><text x="26" y="218" fill="#4bd7ef" font-size="57" font-weight="700" letter-spacing="-3">We Build.</text><text x="26" y="282" fill="#f5f3ef" font-size="57" font-weight="700" letter-spacing="-3">We Elevate.</text><path d="M399 96h115v205H399z" fill="none" stroke="#344252"/><path d="M490 124h-58l-13 14v45l64 22v16h-65v26h80l14-15v-47l-65-23v-11h65v-27z" fill="#328cff"/><rect y="340" width="560" height="242" fill="#f5f3ef"/><text x="26" y="383" fill="#285b83" font-size="12" letter-spacing="2">01 / CAPABILITIES</text><text x="26" y="418" fill="#080b10" font-size="30" font-weight="700">One clear idea.</text><g fill="#080b10" font-size="18"><text x="44" y="466">Branding &amp; Graphic Design</text><text x="44" y="511">Software Development</text><text x="44" y="556">Web Development</text></g><g stroke="#aeb8bf"><path d="M26 430h508M26 478h508M26 523h508M26 568h508"/></g><text x="26" y="605" fill="#a9b9c9" font-size="14">Clear hierarchy, business story, distinctive rhythm.</text></g>
<g transform="translate(1210 30)"><rect width="560" height="620" fill="#f7f2e8"/><text x="26" y="38" fill="#4c3aa0" font-size="13" letter-spacing="2">C / KINETIC MODULES</text><path d="M26 58h508" stroke="#a69ab7"/><rect x="26" y="88" width="314" height="260" fill="#4e3bb3"/><text x="50" y="162" fill="#fff" font-size="52" font-weight="800">MAKE</text><text x="50" y="218" fill="#fff" font-size="52" font-weight="800">IT MOVE.</text><rect x="354" y="88" width="180" height="122" fill="#f87960"/><circle cx="444" cy="149" r="38" fill="#fff"/><rect x="354" y="224" width="180" height="124" fill="#c9ff5e"/><path d="M380 320l76-76 58 76" stroke="#262626" stroke-width="10" fill="none"/><g fill="#222"><rect x="26" y="370" width="170" height="160"/><rect x="208" y="370" width="145" height="160"/><rect x="365" y="370" width="169" height="160"/></g><g fill="#fff" font-size="18"><text x="44" y="415">DESIGN</text><text x="225" y="415">BUILD</text><text x="382" y="415">GROW</text></g><text x="26" y="600" fill="#514b52" font-size="14">High energy; higher motion and usability cost.</text></g>
</g></svg>
